name: os2-hw2-dev

services:
  webapp1:
    build: ./webapp
    hostname: webapp1
    environment:
      HOSTNAME: webapp1
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  webapp2:
    build: ./webapp
    hostname: webapp2
    environment:
      HOSTNAME: webapp2
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m

  classifier:
    build: ./classifier
    environment:
      CLASSIFIER_LOG_PATH: /logs/access.log
      CLASSIFIER_REDIS_URL: redis://redis:6379/0
      CLASSIFIER_METRICS_PORT: "8001"
    volumes:
      - apache_logs:/logs:ro
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  apache:
    build: ./apache
    ports:
      - "443:443"
      - "80:80"
    environment:
      WEBAPP_BACKEND_0: webapp1:8000
      WEBAPP_BACKEND_1: webapp2:8000
    volumes:
      - apache_logs:/logs
      - ./apache/ssl:/usr/local/apache2/conf/ssl:ro
    networks: [frontend, backend]
    depends_on:
      webapp1:
        condition: service_healthy
      webapp2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "httpd", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [backend]
    depends_on: [prometheus]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [backend]
    restart: unless-stopped

  traffic:
    build: ./traffic
    profiles: [traffic]
    environment:
      TARGET_HOST: https://apache
      LOCUST_VERIFY_SSL: "false"
    networks: [backend]
    depends_on: [apache]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  apache_logs:
