apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: apps
  labels:
    app: apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm1
      containers:
        - name: apache
          image: os2-apache:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              hostPort: 443
              name: https
            - containerPort: 80
              hostPort: 80
              name: http
          env:
            - name: WEBAPP_BACKEND_0
              value: webapp-0.webapp.apps.svc.cluster.local:8000
            - name: WEBAPP_BACKEND_1
              value: webapp-1.webapp.apps.svc.cluster.local:8000
          volumeMounts:
            - name: logs
              mountPath: /logs
            - name: apache-config
              mountPath: /usr/local/apache2/conf/httpd.conf.in
              subPath: httpd.conf
            - name: tls
              mountPath: /usr/local/apache2/conf/ssl
              readOnly: true
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
        - name: classifier
          image: os2-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: metrics
          env:
            - name: CLASSIFIER_LOG_PATH
              value: /logs/access.log
            - name: CLASSIFIER_METRICS_PORT
              value: "8001"
          volumeMounts:
            - name: logs
              mountPath: /logs
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: logs
          emptyDir: {}
        - name: apache-config
          configMap:
            name: apache-config
        - name: tls
          secret:
            secretName: apache-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: apps
  labels:
    app: apache
spec:
  type: ClusterIP
  selector:
    app: apache
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: http
      port: 80
      targetPort: 80
