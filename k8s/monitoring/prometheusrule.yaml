apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: security
      rules:
        - alert: DDoSDetected
          expr: increase(log_events_total{category="ddos_suspect"}[1m]) > 10
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: DDoS-like traffic detected
        - alert: AuthAttack
          expr: increase(log_events_total{category="auth_attack"}[1m]) > 5
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: Authentication attack detected
        - alert: HighErrorRate
          expr: increase(log_events_total{category="error_5xx"}[2m]) > 20
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Elevated 5xx error rate
