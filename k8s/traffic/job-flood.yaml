apiVersion: batch/v1
kind: Job
metadata:
  name: locust-flood
  namespace: apps
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: os2-traffic:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_HOST
              value: https://apache.apps.svc.cluster.local
            - name: LOCUST_VERIFY_SSL
              value: "false"
          command:
            - locust
            - -f
            - locustfile.py
            - --headless
            - -u
            - "60"
            - -r
            - "5"
            - --run-time
            - 200s
            - --host
            - https://apache.apps.svc.cluster.local
            - --exit-code-on-error
            - "0"
            - --html
            - /tmp/report.html
