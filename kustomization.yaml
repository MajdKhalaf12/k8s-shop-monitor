apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

configMapGenerator:
  - name: apache-config
    files:
      - httpd.conf=apache/httpd.conf

generatorOptions:
  disableNameSuffixHash: true

resources:
  - k8s/apps/redis-deployment.yaml
  - k8s/apps/webapp-service.yaml
  - k8s/apps/webapp-statefulset.yaml
  - k8s/apps/webapp-pdb.yaml
  - k8s/apps/webapp-hpa.yaml
  - k8s/apps/webapp-networkpolicy.yaml
  - k8s/apps/apache-deployment.yaml
