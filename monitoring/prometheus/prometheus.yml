global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: webapp1
    static_configs:
      - targets: ["webapp1:8000"]
  - job_name: webapp2
    static_configs:
      - targets: ["webapp2:8000"]
  - job_name: classifier
    static_configs:
      - targets: ["classifier:8001"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
